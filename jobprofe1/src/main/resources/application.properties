spring.application.name=jobprofe1
#puedo definir propiedades personalizadas parametros mios
batch.ruta.entrada=datos/entrada
batch.ruta.procesados=datos/procesados
batch.ruta.errores=datos/errores
batch.fichero=clientes.csv
#podemos indicar que trabajo queremos lanzar
#spring.batch.job.name=jobGestionFichero
#evitamos el lanzamiento del job
spring.batch.job.enabled=false
server.port=8080
# Conexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/bd_srping_batch
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Inicializar tablas de metadatos Batch
spring.batch.jdbc.initialize-schema=always

batch.procesador=MySQL
batch.scheduling.cron=0 * * * * *